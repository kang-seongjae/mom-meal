<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>화면 동작 테스트</title></head>
<body>
<pre id="out">실행 중…</pre>
<iframe id="app" width="390" height="844"></iframe>
<script type="module">
// 실제 앱을 틀 안에 띄워 버튼을 눌러 보고, 저장된 기록과 화면 글자를 확인한다.
// 몸무게·음식은 동작 확인용 가상의 예시 값이다.
const results = [];
const frame = document.getElementById('app');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, ms = 8000) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    try { const v = fn(); if (v) return v; } catch {}
    await sleep(50);
  }
  throw new Error('시간 초과: ' + fn.toString().replace(/\s+/g, ' ').slice(0, 90));
}
async function test(name, fn) {
  document.getElementById('out').textContent = results.map((r) => r.join(' | ')).join('\n') + `\n진행 중: ${name}`;
  try { await fn(); results.push(['PASS', name]); } catch (e) { results.push(['FAIL', name, e.message]); }
}
const doc = () => frame.contentDocument;
const text = () => doc().body.innerText;
const stored = () => JSON.parse(localStorage.getItem('momMeal.v1') || '{}');
const $ = (sel) => doc().querySelector(sel);
let loads = 0;
async function open(hash) {
  const before = frame.contentDocument;
  frame.src = `../index.html?load=${++loads}#${hash}`; // 해시만 바꾸면 새로 열리지 않으므로 매번 다시 연다
  await waitFor(() => doc() !== before && doc().readyState === 'complete' && $('#view').children.length);
}
function setVal(sel, v) {
  const el = $(sel);
  el.value = v;
  el.dispatchEvent(new Event('input'));
}
const todayStr = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
async function writeFood(name) {
  setVal('#note', name);
  $('#note-form').requestSubmit();
  await waitFor(() => stored().grow.notes.some((n) => n.name === name && n.date === todayStr));
}
async function saveWeight(kg, timing = '아침') {
  if ($('#w-again')) $('#w-again').click();
  await waitFor(() => $('#w-kg'));
  setVal('#w-kg', String(kg));
  [...doc().querySelectorAll('[data-wtiming]')].find((b) => b.textContent === timing).click();
  const n = stored().weights.length;
  $('#w-save').click();
  await waitFor(() => stored().weights.length === n + 1);
}
const levelText = () => $('.pet-level').textContent;

// 예전 화면(키우기 전)을 쓰던 폰: 몸무게 기록, 목표, 예전 형식의 식사 기록이 있다
const legacyWeights = [
  { id: 'old1', date: daysAgo(5), time: '08:00', kg: 52.4, timing: '아침' },
  { id: 'old2', date: daysAgo(2), time: '20:00', kg: 53.5, timing: '저녁' },
  { id: 'old3', date: daysAgo(1), time: '08:00', kg: 52.8, timing: '아침' },
];
localStorage.clear();
localStorage.setItem('momMeal.v1', JSON.stringify({
  app: 'mom-meal', version: 1, favorites: [], servings: {}, units: {}, customFoods: [],
  weights: legacyWeights,
  meals: [{ id: 'm1', date: daysAgo(1), time: '08:00', code: 'D102-053000000-0001', name: '가래떡', rest: '', unit: 'g',
    amount: 100, per100: { kcal: 195, protein: 3.92, potassium: 23 } }],
  settings: { goalLow: 56, goalHigh: 57, kLow: 100, kHigh: 200, timings: ['아침', '저녁', '기타'] },
}));

await test('처음 시작: 예전 기록이 있으면 몸무게·목표를 이어받고, 친구가 태어난다', async () => {
  await open('today');
  await waitFor(() => text().includes('하루에 몇 번 드실까요'));
  if (doc().querySelectorAll('.slot').length !== 4) throw new Error('기본 4칸이 아님');
  if (getComputedStyle($('.tabbar')).display !== 'none') throw new Error('처음 시작에는 메뉴를 숨김');
  doc().querySelector('[data-step="s-meals"][data-d="1"]').click();
  await waitFor(() => doc().querySelectorAll('.slot').length === 5);
  doc().querySelector('[data-step="s-meals"][data-d="-1"]').click();
  await waitFor(() => doc().querySelectorAll('.slot').length === 4);
  $('#s-next').click();
  await waitFor(() => text().includes('함께 자랄 친구'));
  if (!$('#s-next').disabled) throw new Error('친구를 고르기 전에 다음으로 넘어감');
  if (doc().querySelectorAll('.pet-option').length !== 4) throw new Error('친구가 넷이 아님');
  $('[data-pet="bear"]').click();
  await waitFor(() => $('[data-pet="bear"]').classList.contains('on'));
  $('#s-next').click();
  const nameInput = await waitFor(() => $('#s-name'));
  if (nameInput.hasAttribute('placeholder') || nameInput.value !== '') throw new Error('이름 칸 안은 비어 있어야 함');
  if (!text().includes('이름을 지어 주세요') || $('#s-name-hint').textContent !== '비워 두면 도토리로 불러요.') throw new Error('이름 안내: ' + $('#s-name-hint')?.textContent);
  if (!nameInput.closest('label').textContent.trim().startsWith('친구 이름')) throw new Error('칸 위 제목 없음');
  setVal('#s-name', '콩이');
  $('#s-next').click();
  await waitFor(() => $('#s-kg'));
  if ($('#s-kg').value !== '52.8' || $('#s-goal').value !== '56') throw new Error(`이어받기: ${$('#s-kg').value}, ${$('#s-goal').value}`);
  setVal('#s-kg', '53');
  $('#s-done').click();
  await waitFor(() => stored().grow?.started);
  const s = stored();
  const g = s.grow;
  if (g.pet !== 'bear' || g.name !== '콩이' || g.mealsPerDay !== 4 || g.startKg !== 53 || g.timing !== '아침' || g.startDate !== todayStr) throw new Error(JSON.stringify(g));
  for (const w of legacyWeights) if (!s.weights.some((x) => JSON.stringify(x) === JSON.stringify(w))) throw new Error('예전 몸무게 기록이 바뀜');
  if (s.weights.length !== legacyWeights.length + 1) throw new Error('오늘 몸무게가 하나 더해져야 함');
  if (s.meals.length !== 1) throw new Error('예전 식사 기록이 사라짐');
  await waitFor(() => !$('#celebrate').hidden && $('#celebrate').textContent.includes('콩이가 태어났어요'));
  await waitFor(() => $('.pet-stage svg')?.getAttribute('aria-label').startsWith('콩이(곰)') && $('.pet-call')?.textContent === '콩이');
  if (frame.contentWindow.location.hash !== '#today') throw new Error(frame.contentWindow.location.hash);
});

await test('음식 적기: 적을 때마다 칸이 채워지고, 다 채우면 친구가 기뻐하며 칭찬', async () => {
  await open('today');
  if ($('#note').hasAttribute('placeholder') || $('label[for="note"]')?.textContent !== '드신 음식 이름') throw new Error('음식 칸 위 제목');
  await writeFood('흰죽');
  await waitFor(() => doc().querySelectorAll('.slot.on').length === 1);
  if (!$('#toast').textContent.includes('잘 드셨어요')) throw new Error($('#toast').textContent);
  // 자주 먹은 음식 버튼으로 다시 적기
  (await waitFor(() => $('[data-quick="흰죽"]'))).click();
  await waitFor(() => doc().querySelectorAll('.slot.on').length === 2);
  await writeFood('삶은 달걀');
  if ($('.pet-happy')) throw new Error('다 채우기 전에 기뻐함');
  await writeFood('두유');
  await waitFor(() => doc().querySelectorAll('.slot.on').length === 4);
  await waitFor(() => !$('#celebrate').hidden && $('#celebrate').textContent.includes('콩이가 배불러서 기뻐해요') && $('#celebrate').textContent.includes('4번 다 드셨어요'));
  await waitFor(() => $('.pet-stage .pet-happy') && $('.bubble').textContent.includes('콩이가 배불러서 기뻐해요'));
  await writeFood('카스텔라');
  await waitFor(() => $('.slot-extra')?.textContent === '+1');
  if (doc().querySelectorAll('.list li').length !== 5) throw new Error('오늘 목록');
});

await test('음식 지우기: 지우면 칸도 줄어든다', async () => {
  await open('today');
  frame.contentWindow.confirm = () => true;
  const btn = [...doc().querySelectorAll('[data-del-note]')].at(-1);
  btn.click();
  await waitFor(() => stored().grow.notes.filter((n) => n.date === todayStr).length === 4);
});

await test('칼륨 주의: 설정에 적은 이름이 들어간 음식을 적으면 부드럽게 알리고, 기록은 그대로', async () => {
  await open('settings');
  (await waitFor(() => $('#caution'))).value = '바나나, 토마토';
  $('#save-settings').click();
  await waitFor(() => stored().grow.cautionWords.join('|') === '바나나|토마토');
  await open('today');
  await writeFood('바나나 우유');
  const note = await waitFor(() => $('.knote'));
  if (!note.textContent.includes('칼륨 주의 음식') || !note.textContent.includes('기록은 그대로')) throw new Error(note.textContent);
  if (![...doc().querySelectorAll('.kbadge')].some((b) => b.textContent === '칼륨 주의')) throw new Error('목록 표시 없음');
});

await test('성장: 0.5kg 늘면 한 단계 자라고, 줄어도 작아지지 않으며 응원만 한다', async () => {
  await open('today');
  await waitFor(() => levelText().startsWith('0/6단계'));  // 처음 53kg, 목표 56kg → 6단계
  await saveWeight(53.5);
  await waitFor(() => !$('#celebrate').hidden && $('#celebrate').textContent.includes('콩이가 쑥 자랐어요'));
  await waitFor(() => levelText().startsWith('1/6단계'));
  await saveWeight(53.1);
  await waitFor(() => $('#toast').textContent.includes('괜찮아요, 콩이랑'));
  await waitFor(() => levelText().startsWith('1/6단계') && $('.pet-stage .pet-cheer') && $('.bubble').textContent.includes('콩이는 그대로 자라 있어요'));
});

await test('성장: 다른 측정 시점 몸무게로는 자라지 않는다', async () => {
  await open('today');
  await saveWeight(55.5, '저녁');
  await sleep(200);
  if (!levelText().startsWith('1/6단계')) throw new Error(levelText());
});

await test('성장: 목표 몸무게에 도착하면 마지막 모습(꽃왕관)', async () => {
  await open('today');
  await saveWeight(56);
  await waitFor(() => !$('#celebrate').hidden && $('#celebrate').textContent.includes('목표에 도착했어요'));
  await waitFor(() => levelText().startsWith('6/6단계') && $('.pet-name').textContent.includes('꽃왕관'));
});

await test('기록 화면: 예전 몸무게도 그래프에 이어지고, 잘못 적은 몸무게를 지우면 단계도 돌아간다', async () => {
  await open('records');
  await waitFor(() => $('#chart svg'));
  const dots = doc().querySelectorAll('#chart .dot').length;
  if (dots < 3) throw new Error(`아침 몸무게 점 ${dots}개`);
  if (!text().includes('가래떡')) throw new Error('예전 식사 기록 이름이 안 보임');
  frame.contentWindow.confirm = () => true;
  const w56 = stored().weights.find((w) => w.kg === 56);
  $(`[data-del-weight="${w56.id}"]`).click();
  await waitFor(() => !stored().weights.some((w) => w.kg === 56));
  await open('today');
  await waitFor(() => levelText().startsWith('1/6단계'));
});

await test('백업: 전체 백업에는 키우기 기록이, 설정만 내보내기에는 설정만 들어간다', async () => {
  await open('settings');
  const w = frame.contentWindow;
  const saved = [];
  w.HTMLAnchorElement.prototype.click = function () { saved.push({ name: this.download, href: this.href }); };
  (await waitFor(() => $('#export'))).click();
  $('#export-settings').click();
  await waitFor(() => saved.length === 2);
  const full = JSON.parse(await (await w.fetch(saved[0].href)).text());
  const sett = JSON.parse(await (await w.fetch(saved[1].href)).text());
  if (full.grow.pet !== 'bear' || full.grow.notes.length !== 5 || full.weights.length < 5) throw new Error('전체 백업 내용');
  if ('meals' in sett || 'weights' in sett || JSON.stringify(sett).includes('흰죽') || 'startKg' in sett.growSettings) throw new Error('설정 파일에 기록이 들어감');
  if (sett.growSettings.cautionWords.join('|') !== '바나나|토마토') throw new Error(JSON.stringify(sett.growSettings));
  window.__full = JSON.stringify(full);
  window.__sett = JSON.stringify(sett);
});

async function importFile(textContent, route = 'settings', inputSel = '#import') {
  await open(route);
  const win = frame.contentWindow;
  let asked = '';
  win.confirm = (msg) => { asked = msg; return true; };
  const input = await waitFor(() => $(inputSel));
  const dt = new win.DataTransfer();
  dt.items.add(new win.File([textContent], 'backup.json', { type: 'application/json' }));
  input.files = dt.files;
  input.dispatchEvent(new win.Event('change'));
  await waitFor(() => asked);
  return asked;
}

await test('백업 불러오기: 새 폰의 처음 시작 화면에서 전체 백업을 불러오면 친구와 기록이 그대로 이어진다', async () => {
  localStorage.clear();
  const asked = await importFile(window.__full, 'today', '#import-start');
  if (!asked.includes('전체 백업')) throw new Error(asked);
  await waitFor(() => stored().grow?.started && stored().grow.notes.length === 5);
  await open('today');
  await waitFor(() => $('.pet-stage svg')?.getAttribute('aria-label').startsWith('콩이(곰)') && levelText().startsWith('1/6단계'));
});

await test('설정 파일 불러오기: 기록은 그대로 두고 주의 음식만 합친다', async () => {
  const s = stored();
  s.grow.cautionWords = ['키위'];
  localStorage.setItem('momMeal.v1', JSON.stringify(s));
  const asked = await importFile(window.__sett);
  if (!asked.includes('설정만 합칠까요')) throw new Error(asked);
  await waitFor(() => stored().grow.cautionWords.join('|') === '키위|바나나|토마토');
  if (stored().grow.notes.length !== 5 || stored().weights.length !== s.weights.length) throw new Error('기록이 바뀜');
});

await test('설정에서 이름 바꾸기, 비우면 기본 이름', async () => {
  await open('settings');
  (await waitFor(() => $('#set-name'))).value = '봄이';
  $('#save-settings').click();
  await waitFor(() => stored().grow.name === '봄이');
  await open('today');
  await waitFor(() => $('.pet-call').textContent === '봄이' && $('.bubble').textContent.includes('봄이'));
  await open('settings');
  (await waitFor(() => $('#set-name'))).value = '';
  $('#save-settings').click();
  await waitFor(() => stored().grow.name === '');
  await open('today');
  await waitFor(() => $('.pet-call').textContent === '도토리');
});

await test('이름 없이 이미 시작했던 사람: 친구·단계·기록은 그대로, 기본 이름으로 부르고 설정에서 이름을 붙일 수 있다', async () => {
  // 이름 기능이 생기기 전 버전에서 저장된 상태 (grow 에 name 이 없음)
  const before = {
    app: 'mom-meal', version: 1, meals: [], favorites: [], servings: {}, units: {}, customFoods: [],
    weights: [{ id: 'a', date: daysAgo(3), time: '08:00', kg: 52, timing: '아침' }, { id: 'b', date: daysAgo(1), time: '08:00', kg: 53.1, timing: '아침' }],
    settings: { goalLow: 56, goalHigh: 56, kLow: 100, kHigh: 200, timings: ['아침', '저녁', '기타'] },
    grow: { started: true, pet: 'cat', mealsPerDay: 3, timing: '아침', startKg: 52, startDate: daysAgo(3), cautionWords: [],
      notes: [{ id: 'n', date: daysAgo(1), time: '08:00', name: '흰죽' }] },
  };
  localStorage.setItem('momMeal.v1', JSON.stringify(before));
  await open('today');
  await waitFor(() => $('.pet-call')?.textContent === '나비');
  if (!levelText().startsWith('2/8단계')) throw new Error(levelText());
  if (!$('.pet-stage svg').getAttribute('aria-label').startsWith('나비(고양이), 새싹')) throw new Error($('.pet-stage svg').getAttribute('aria-label'));
  await open('settings');
  const inp = await waitFor(() => $('#set-name'));
  if (inp.value !== '' || inp.hasAttribute('placeholder') || $('#set-name-hint').textContent !== '비워 두면 나비로 불러요.') throw new Error('이름 칸');
  $('[data-pet="bunny"]').click();
  if ($('#set-name-hint').textContent !== '비워 두면 몽실로 불러요.') throw new Error('친구를 바꾸면 안내도 바뀜: ' + $('#set-name-hint').textContent);
  $('[data-pet="cat"]').click();
  inp.value = '구름';
  $('#save-settings').click();
  await waitFor(() => stored().grow.name === '구름');
  const after = stored();
  if (JSON.stringify(after.weights) !== JSON.stringify(before.weights) || after.grow.pet !== 'cat'
    || after.grow.startKg !== 52 || JSON.stringify(after.grow.notes) !== JSON.stringify(before.grow.notes)) throw new Error('기록이 바뀜');
  await open('today');
  await waitFor(() => $('.pet-call').textContent === '구름' && levelText().startsWith('2/8단계'));
});

await test('움직임: 가만히 있을 때 숨 쉬고 눈을 깜빡인다 (동작 줄이기 규칙은 계산 테스트에서 확인)', async () => {
  await open('today');
  const w = frame.contentWindow;
  const move = await waitFor(() => $('.pet-stage .pet-move'));
  const svg = $('.pet-stage svg');
  const expect = svg.classList.contains('pet-normal') ? 'pet-breathe' : svg.classList.contains('pet-happy') ? 'pet-hop' : 'pet-sway';
  if (w.getComputedStyle(move).animationName !== expect) throw new Error(w.getComputedStyle(move).animationName);
  const eye = $('.pet-stage .pet-eye');
  if (eye && w.getComputedStyle(eye).animationName !== 'pet-blink') throw new Error('깜빡임 없음');
});

// 오프라인 동작은 tools/run_tests.py 가 서버를 끈 뒤 다시 열어서 확인한다.

localStorage.clear();
const fails = results.filter((r) => r[0] === 'FAIL');
document.getElementById('out').textContent =
  results.map((r) => r.join(' | ')).join('\n') + `\nSUMMARY: ${results.length - fails.length} passed, ${fails.length} failed`;
</script>
</body>
</html>
