<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>화면 동작 테스트</title></head>
<body>
<pre id="out">실행 중…</pre>
<iframe id="app" width="390" height="844"></iframe>
<script type="module">
// 실제 앱을 틀 안에 띄워 버튼을 눌러 보고, 저장된 기록과 화면 글자를 확인한다.
const results = [];
const frame = document.getElementById('app');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, ms = 8000) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    try { const v = fn(); if (v) return v; } catch {}
    await sleep(50);
  }
  throw new Error('시간 초과');
}
async function test(name, fn) {
  document.getElementById('out').textContent = results.map((r) => r.join(' | ')).join('\n') + `\n진행 중: ${name}`;
  try { await fn(); results.push(['PASS', name]); } catch (e) { results.push(['FAIL', name, e.message]); }
}
const doc = () => frame.contentDocument;
const text = () => doc().body.innerText;
const stored = () => JSON.parse(localStorage.getItem('momMeal.v1') || '{}');
let loads = 0;
async function open(hash) {
  const before = frame.contentDocument;
  frame.src = `../index.html?load=${++loads}#${hash}`; // 해시만 바꾸면 새로 열리지 않으므로 매번 다시 연다
  await waitFor(() => doc() !== before && doc().readyState === 'complete' && doc().querySelector('#view').children.length);
}

localStorage.clear();

await test('식사 기록: 양(150g) 고르고 기록하면 저장되고 오늘 합계에 반영', async () => {
  await open('meal?food=D102-053000000-0001'); // 가래떡 100g당 195kcal, 단백질 3.92g, 칼륨 23mg
  const btn = await waitFor(() => [...doc().querySelectorAll('.amount')].find((b) => b.textContent.includes('150g')));
  btn.click();
  await waitFor(() => doc().querySelector('.result-box').textContent.includes('293')); // 195*1.5=292.5
  doc().querySelector('#save-meal').click();
  const m = await waitFor(() => stored().meals?.[0]);
  if (m.amount !== 150 || m.per.kcal !== 195 || m.per.potassium !== 23 || m.basis !== 100) throw new Error(JSON.stringify(m));
  await open('home');
  await waitFor(() => text().includes('293') && text().includes('5.9')); // 3.92*1.5=5.88
});

await test('칼륨 정보 없는 음식: 화면에 "칼륨 정보 없음", 저장값은 null', async () => {

  await waitFor(() => doc().querySelector('.knote.k-unknown')?.textContent.includes('칼륨 정보 없음'));
  doc().querySelector('#save-meal').click();
  await waitFor(() => stored().meals?.length === 2);
  if (stored().meals[1].per.potassium !== null) throw new Error('null 이 아님');
  await open('meal');
  await waitFor(() => [...doc().querySelectorAll('.kbadge')].some((b) => b.textContent === '칼륨 정보 없음'));
});

// ───── 개수 단위 · 직접 입력 음식 · 직접 만든 음식 ─────
// 라벨 수치(400kcal 등)는 화면 동작 확인용 가상 값이다.
const EGG = 'D327-758010000-0001';   // 달걀_삶은것 100g당 150kcal
const RICE = 'D301-022000000-0001';  // 쌀밥 100g당 166kcal
function setVal(sel, v) {
  const el = doc().querySelector(sel);
  el.value = v;
  el.dispatchEvent(new Event('input'));
}

await test('개수 단위: 삶은 달걀 "1개 = 50g" 설정 → "2개" 골라 기록', async () => {
  await open(`meal?food=${EGG}`);
  await waitFor(() => doc().querySelector('#unit-name'));
  doc().querySelector('#unit-name').value = '개';
  doc().querySelector('#unit-amount').value = '50';
  doc().querySelector('#apply-fine').click();
  const two = await waitFor(() => [...doc().querySelectorAll('.amount')].find((b) => b.textContent.includes('2개') && b.textContent.includes('100g')));
  two.click();
  await waitFor(() => doc().querySelector('.result-box').textContent.includes('150 kcal'));
  const before = stored().meals.length;
  doc().querySelector('#save-meal').click();
  const m = await waitFor(() => stored().meals.length === before + 1 && stored().meals.at(-1));
  if (m.amount !== 100 || m.amountLabel !== '2개') throw new Error(JSON.stringify(m));
  if (JSON.stringify(stored().units[EGG]) !== '{"name":"개","amount":50}') throw new Error('단위 저장 안 됨');
  await open('meal');
  await waitFor(() => text().includes('2개 (100g)'));
});

let labelCode;
await test('직접 입력 음식: 수치를 비워 둔 채 등록 → 즐겨찾기에 추가, 기록은 막히고 안내', async () => {
  await open('label?id=new');
  setVal('#l-name', '영양음료(테스트)');
  doc().querySelector('#l-save').click();
  const c = await waitFor(() => stored().customFoods?.find((x) => x.kind === 'label'));
  labelCode = c.code;
  for (const k of ['basis', 'kcal', 'protein', 'potassium']) if (c[k] !== null) throw new Error(`${k} 값이 ${c[k]}`);
  if (!stored().favorites.includes(labelCode)) throw new Error('즐겨찾기 안 됨');
  await waitFor(() => [...doc().querySelectorAll('.tag')].some((t) => t.textContent === '수치 입력 필요'));
  await open(`meal?food=${labelCode}`);
  const btn = await waitFor(() => doc().querySelector('#save-meal'));
  if (!btn.disabled) throw new Error('기록 버튼이 눌림');
  if (!doc().querySelector('.result-box').textContent.includes('아직 입력하지 않았어요')) throw new Error('안내 없음');
});

await test('직접 입력 음식: 라벨 수치를 채우면 "1팩"으로 기록, 출처 "직접 입력(제품 라벨)"', async () => {

  await waitFor(() => stored().customFoods.find((x) => x.code === labelCode).basis === 200);
  await open(`meal?food=${labelCode}`);
  await waitFor(() => doc().querySelector('.amount.on')?.textContent.includes('1팩'));
  const box = doc().querySelector('.result-box').textContent;
  if (!box.includes('400 kcal') || !box.includes('칼륨 정보 없음')) throw new Error(box);
  if (!doc().querySelector('#sheet').textContent.includes('직접 입력(제품 라벨)')) throw new Error('출처 표시 없음');
  doc().querySelector('#save-meal').click();
  const m = await waitFor(() => stored().meals.find((x) => x.code === labelCode));
  if (m.amount !== 200 || m.basis !== 200 || m.per.kcal !== 400 || m.per.potassium !== null || m.source !== '직접 입력(제품 라벨)') {
    throw new Error(JSON.stringify(m));
  }
  await open('meal');
  await waitFor(() => [...doc().querySelectorAll('.fav-name')].some((b) => b.textContent === '영양음료(테스트)'));

let oilCode;

  if (c.potassium !== null || stored().favorites.includes(oilCode)) throw new Error(JSON.stringify(c));

await test('직접 만든 음식: 재료 3개로 1인분 저장 → 즐겨찾기 → 기록, "칼륨 일부 정보 없음"', async () => {
  await open('recipe?id=new');
  async function addIng(q, code, amount) {
    const input = await waitFor(() => doc().querySelector('#ing-q'));
    input.value = q;
    input.dispatchEvent(new Event('input'));
    (await waitFor(() => doc().querySelector(`[data-ing="${code}"]`))).click();
    await waitFor(() => doc().querySelector('#ing-amount'));
    if (amount != null) setVal('#ing-amount', String(amount));
    doc().querySelector('#ing-add').click();
    await waitFor(() => doc().querySelector('#ing-q'));
  }
  await addIng('쌀밥', RICE, 210);
  await addIng('달걀_삶은것', EGG, null);  // 개수 단위가 있어 "1개(50g)"가 기본
  await addIng('참기름', oilCode, 5);
  setVal('#r-name', '계란밥(테스트)');
  await waitFor(() => text().includes('칼륨 일부 정보 없음'));
  doc().querySelector('#r-save').click();
  const r = await waitFor(() => stored().customFoods.find((x) => x.kind === 'recipe'));
  const expectKcal = 166 * 2.1 + 150 * 0.5 + 900 * 0.05;
  if (r.name !== '계란밥(테스트)' || r.items.length !== 3 || Math.abs(r.kcal - expectKcal) > 1e-6 || !r.potassiumPartial) {
    throw new Error(JSON.stringify(r));
  }
  const egg = r.items.find((it) => it.code === EGG);
  if (egg.amount !== 50 || egg.amountLabel !== '1개') throw new Error(JSON.stringify(egg));
  if (!stored().favorites.includes(r.code)) throw new Error('즐겨찾기 안 됨');

  await open('meal');
  (await waitFor(() => [...doc().querySelectorAll('.fav-name')].find((b) => b.textContent === '계란밥(테스트)'))).click();
  await waitFor(() => doc().querySelector('.amount.on')?.textContent.includes('1인분'));
  const box = doc().querySelector('.result-box').textContent;
  if (!box.includes(`${Math.round(expectKcal)} kcal`) || !box.includes('칼륨 일부 정보 없음')) throw new Error(box);
  doc().querySelector('#save-meal').click();
  const m = await waitFor(() => stored().meals.find((x) => x.code === r.code));
  if (m.amount !== 1 || m.basis !== 1 || !m.per.potassiumPartial) throw new Error(JSON.stringify(m));
  await open('meal');
  await waitFor(() => [...doc().querySelectorAll('.kbadge')].some((b) => b.textContent === '칼륨 일부 정보 없음'));
});

await test('라벨 수치를 고치면 그 재료로 만든 음식도 다시 계산', async () => {
  await open(`label?id=${oilCode}`);

await test('설정만 내보내기 → 다른 폰에서 불러오기: 기록은 그대로, 설정만 합치고 두 번 불러와도 중복 없음', async () => {
  const label = { code: 'my-e2e-label', kind: 'label', name: '라벨 음식(테스트)', basis: 200, unit: 'ml', kcal: 400, protein: 14, potassium: null };
  const recipe = { code: 'my-e2e-recipe', kind: 'recipe', name: '만든 음식(테스트)',
    items: [{ code: label.code, name: label.name, unit: 'ml', basis: 200, amount: 100, per: { kcal: 400, protein: 14, potassium: null } }],
    kcal: 200, protein: 7, potassium: null, potassiumPartial: false };
  const base = { app: 'mom-meal', version: 1, servings: {} };
  // 폰 A: 설정을 만들어 둔 폰
  localStorage.setItem('momMeal.v1', JSON.stringify({ ...base,
    meals: [{ id: 'a1', date: '2026-10-01', amount: 1, basis: 1, code: recipe.code, name: recipe.name, unit: '인분', per: { kcal: 200, protein: 7, potassium: null } }],
    weights: [{ id: 'aw', date: '2026-10-01', kg: 52, timing: '아침' }],
    favorites: [label.code, recipe.code], customFoods: [label, recipe],
    units: { [EGG]: { name: '개', amount: 50 } }, servings: { [RICE]: 210 },
    settings: { goalLow: 55, goalHigh: 57, kLow: 120, kHigh: 250, timings: ['아침', '저녁', '운동 후'] } }));
  await open('settings');
  const w = frame.contentWindow;
  let saved = null;
  w.HTMLAnchorElement.prototype.click = function () { saved = { name: this.download, href: this.href }; };
  (await waitFor(() => doc().querySelector('#export-settings'))).click();
  await waitFor(() => saved);
  if (!saved.name.startsWith('식사기록-설정-')) throw new Error(saved.name);
  const fileText = await (await w.fetch(saved.href)).text();
  const out = JSON.parse(fileText);
  if ('meals' in out || 'weights' in out || out.customFoods.length !== 2) throw new Error('내보낸 내용이 이상함');

  // 폰 B: 자기 기록이 있는 폰
  const bMeal = { id: 'b1', date: '2026-10-02', amount: 100, basis: 100, code: RICE, name: '쌀밥', unit: 'g', per: { kcal: 166, protein: 3.36, potassium: 26 } };
  const bWeight = { id: 'bw', date: '2026-10-02', kg: 60, timing: '저녁' };
  localStorage.setItem('momMeal.v1', JSON.stringify({ ...base, meals: [bMeal], weights: [bWeight], favorites: [RICE],
    customFoods: [], units: {}, settings: { goalLow: null, goalHigh: null, kLow: 100, kHigh: 200, timings: ['아침', '기타'] } }));
  async function importFile() {
    await open('settings');
    const win = frame.contentWindow;
    let asked = '';
    win.confirm = (msg) => { asked = msg; return true; };
    const input = await waitFor(() => doc().querySelector('#import'));
    const dt = new win.DataTransfer();
    dt.items.add(new win.File([fileText], 'settings.json', { type: 'application/json' }));
    input.files = dt.files;
    input.dispatchEvent(new win.Event('change'));
    await waitFor(() => asked);
    return asked;
  }
  const asked1 = await importFile();
  if (!asked1.includes('설정만 합칠까요') || !asked1.includes('새로 추가할 음식 2개')) throw new Error(asked1);
  await waitFor(() => stored().customFoods.length === 2);
  let s = stored();
  if (JSON.stringify(s.meals) !== JSON.stringify([bMeal]) || JSON.stringify(s.weights) !== JSON.stringify([bWeight])) throw new Error('기록이 바뀜');
  if (s.favorites.join('|') !== [RICE, label.code, recipe.code].join('|')) throw new Error(s.favorites.join('|'));
  if (s.units[EGG]?.amount !== 50 || s.servings[RICE] !== 210) throw new Error('단위·무게 안 합쳐짐');
  if (s.settings.goalLow !== 55 || s.settings.kHigh !== 250 || s.settings.timings.join('|') !== '아침|저녁|운동 후') throw new Error(JSON.stringify(s.settings));

  // 같은 파일을 한 번 더 불러와도 늘어나지 않는다
  const asked2 = await importFile();
  if (!asked2.includes('새로 추가할 음식 0개') || !asked2.includes('이미 있어서 건너뛸 음식 2개')) throw new Error(asked2);
  await waitFor(() => doc().querySelector('#toast') && !doc().querySelector('#toast').hidden);
  s = stored();
  if (s.customFoods.length !== 2 || s.favorites.length !== 3 || s.meals.length !== 1) throw new Error(JSON.stringify(s));
  await open('meal');
  await waitFor(() => [...doc().querySelectorAll('.fav-name')].map((b) => b.textContent).join('|') === '쌀밥|라벨 음식(테스트)|만든 음식(테스트)');
});

await test('홈 진행 막대·즐겨찾기 이모지·기록 축하 문구', async () => {
  localStorage.setItem('momMeal.v1', JSON.stringify({
    app: 'mom-meal', version: 1, meals: [], servings: {}, units: {}, customFoods: [],
    favorites: [RICE, EGG],
    weights: [{ id: 'w1', date: '2026-10-01', time: '08:00', kg: 52, timing: '아침' },
      { id: 'w2', date: '2026-10-10', time: '08:00', kg: 53, timing: '아침' }],
    settings: { goalLow: 55, goalHigh: 57, kLow: 100, kHigh: 200, timings: ['아침', '저녁', '기타'] },
  }));
  await open('home');
  const bar = await waitFor(() => doc().querySelector('.progress[role="progressbar"]'));
  if (bar.getAttribute('aria-valuenow') !== '33' || !text().includes('33%')) throw new Error(bar.outerHTML);
  if (!text().includes('목표 55~57kg까지') || !text().includes('2kg')) throw new Error('남은 양 표시 없음');
  // 순서: 체중 카드 → 오늘 드신 양 → (기록 버튼) → 그래프
  const order = [...doc().querySelectorAll('.card')].map((c) => c.className);
  if (order.join('|') !== 'card card-peach|card card-butter|card card-sky') throw new Error(order.join('|'));
  await open('meal');
  const favs = await waitFor(() => doc().querySelectorAll('.fav').length === 2 && [...doc().querySelectorAll('.fav')]);
  const icons = favs.map((b) => b.querySelector('.fav-emoji').textContent).join('');
  if (icons !== '🍚🥚') throw new Error(icons);
  favs[0].click();
  await waitFor(() => doc().querySelector('#save-meal'));
  doc().querySelector('#save-meal').click();
  const c = await waitFor(() => !doc().querySelector('#celebrate').hidden && doc().querySelector('#celebrate'));
  if (!/잘 드셨어요|맛있게 드셨네요|잘하셨어요|힘내셨어요/.test(c.textContent)) throw new Error(c.textContent);
  if (c.getAttribute('role') !== 'status') throw new Error('화면 읽기 프로그램 안내 없음');
  if (stored().meals.length !== 1) throw new Error('기록 안 됨');

  // 음식이 지정된 주소(#meal?food=…)로 열어 기록해도 창이 다시 열리지 않는다
  await open(`meal?food=${EGG}`);
  (await waitFor(() => doc().querySelector('#save-meal'))).click();
  await waitFor(() => stored().meals.length === 2);
  await sleep(300);
  if (!doc().querySelector('#sheet').hidden) throw new Error('기록 뒤에 창이 다시 열림');
  if (frame.contentWindow.location.hash !== '#meal') throw new Error(frame.contentWindow.location.hash);
});

// 오프라인 동작은 tools/run_tests.py 가 서버를 끈 뒤 다시 열어서 확인한다.

localStorage.clear();
const fails = results.filter((r) => r[0] === 'FAIL');
document.getElementById('out').textContent =
  results.map((r) => r.join(' | ')).join('\n') + `\nSUMMARY: ${results.length - fails.length} passed, ${fails.length} failed`;
</script>
</body>
