<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>스크린샷용 예시 기록</title></head>
<body>
<p>스크린샷용 예시 기록을 넣는 중… (테스트 전용, 실제 앱에서는 쓰지 않음)</p>
<script type="module">
// 사용법: tests/seed.html?go=today&kg=54&n=2  → 예시 기록을 넣고 ../index.html#today 로 이동
//   pet=bunny|chick|bear|cat  친구 (기본 bunny)
//   kg=54                     오늘 아침 몸무게 (처음 52kg, 목표 56kg → 0.5kg 마다 한 단계, 모두 8단계)
//   drop=1                    전날보다 몸무게가 줄어든 날 (응원)
//   n=4                       오늘 적은 음식 수 (하루 4번이면 다 채움)
//   fresh=1                   아무 기록도 없는 처음 상태
//   legacy=1                  키우기를 시작하기 전(예전 화면)의 기록만 있는 상태
// 몸무게·음식은 화면 확인용 가상의 예시 값이다 (실제 사람의 기록이 아님).
import { localDate, addDays } from '../js/calc.js';

const p = new URLSearchParams(location.search);
const today = localDate();
const go = p.get('go') || 'today';
const KEY = 'momMeal.v1';

if (p.get('fresh')) {
  localStorage.removeItem(KEY);
} else {
  const kg = Number(p.get('kg') || 53.2);
  const weights = [];
  // 열흘 전 52kg 에서 시작해 kg 까지 조금씩 늘어난 아침 몸무게
  for (let i = 0; i < 10; i++) {
    const v = Math.round((52 + ((kg - 52) * i) / 9) * 10) / 10;
    weights.push({ id: `w${i}`, date: addDays(today, -(9 - i)), time: '08:00', kg: v, timing: '아침' });
  }
  if (p.get('drop')) weights.push({ id: 'wd', date: today, time: '09:00', kg: Math.round((kg - 0.4) * 10) / 10, timing: '아침' });
  weights.push({ id: 'we', date: addDays(today, -1), time: '20:00', kg: kg + 0.8, timing: '저녁' });

  const foods = ['흰죽', '삶은 달걀', '바나나우유', '쌀밥', '두유', '카스텔라'];
  const notes = [];
  for (let d = 1; d <= 6; d++) {
    const count = d % 3 === 0 ? 3 : 4;
    for (let i = 0; i < count; i++) notes.push({ id: `n${d}-${i}`, date: addDays(today, -d), time: `${8 + i * 4}:00`, name: foods[(d + i) % foods.length] });
  }
  const n = Number(p.get('n') ?? 2);
  for (let i = 0; i < n; i++) notes.push({ id: `t${i}`, date: today, time: `${8 + i * 3}:00`, name: foods[i % foods.length] });

  const legacy = !!p.get('legacy');
  localStorage.setItem(KEY, JSON.stringify({
    app: 'mom-meal', version: 1,
    meals: legacy ? [{ id: 'm1', date: today, time: '08:00', code: 'D704-212000000-0001', name: '흰죽', rest: '', unit: 'ml',
      amount: 250, basis: 100, per: { kcal: 64, protein: 1.2, potassium: 16 } }] : [],
    weights, favorites: [], servings: {}, units: {}, customFoods: [],
    settings: { goalLow: 56, goalHigh: 56, kLow: 100, kHigh: 200, timings: ['아침', '저녁', '기타'] },
    grow: legacy ? undefined : {
      started: true, pet: p.get('pet') || 'bunny', mealsPerDay: 4, timing: '아침',
      startKg: 52, startDate: addDays(today, -9), cautionWords: ['바나나'], notes,
    },
  }));
}
location.replace(`../index.html#${go}`);
</script>
</body>
</html>
