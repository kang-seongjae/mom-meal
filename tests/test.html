<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>계산 테스트</title></head>
<body>
<pre id="out">실행 중…</pre>
<script type="module">
import {
  scale, servingsToAmount, mealNutrients, dayTotals, recentAverage, compareToday, potassiumLevel,
  addDays, remainingToGoal, cheerMessage, validateBackup, latestWeight, DEFAULT_SETTINGS,
  goalText, parseGoal, parseTimings,
} from '../js/calc.js';
import { loadFoods, getFood, searchFoods } from '../js/foods.js';

const results = [];
function test(name, fn) {
  return Promise.resolve().then(fn).then(
    () => results.push(['PASS', name]),
    (e) => results.push(['FAIL', name, e.message]),
  );
}
function eq(actual, expected, msg = '') {
  const ok = typeof expected === 'number' && typeof actual === 'number'
    ? Math.abs(actual - expected) < 1e-9
    : actual === expected;
  if (!ok) throw new Error(`${msg} 기대 ${JSON.stringify(expected)}, 실제 ${JSON.stringify(actual)}`);
}

// 100g당 값으로 만든 식사 기록
const meal = (date, amount, kcal, protein, potassium) => ({ date, amount, per100: { kcal, protein, potassium } });

await test('그램 환산: 100g 기준 값을 먹은 양으로 비례 계산', () => {
  eq(scale(195, 100), 195);
  eq(scale(195, 250), 487.5);
  eq(scale(3.92, 50), 1.96);
  eq(scale(80, 0), 0);
});
await test('그램 환산: 한 그릇 = 250g 이면 1.5그릇 = 375g', () => {
  eq(servingsToAmount(1.5, 250), 375);
  eq(servingsToAmount(0.5, 250), 125);
  const n = mealNutrients(meal('2026-10-17', servingsToAmount(1.5, 250), 120, 4, 200));
  eq(n.kcal, 450); eq(n.protein, 15); eq(n.potassium, 750);
});
await test('하루 합계: 같은 날 기록만 더한다', () => {
  const meals = [
    meal('2026-10-17', 200, 150, 5, 100),   // 300kcal, 10g, 200mg
    meal('2026-10-17', 50, 400, 20, 300),   // 200kcal, 10g, 150mg
    meal('2026-10-16', 100, 999, 99, 999),  // 다른 날
  ];
  const t = dayTotals(meals, '2026-10-17');
  eq(t.count, 2); eq(t.kcal, 500); eq(t.protein, 20);
  eq(t.potassiumKnown, 350); eq(t.potassiumMissing, 0);
});
await test('하루 합계: 기록 없는 날은 0건 0kcal', () => {
  const t = dayTotals([meal('2026-10-17', 100, 100, 1, 1)], '2026-10-15');
  eq(t.count, 0); eq(t.kcal, 0);
});
await test('칼륨 없음: 값이 없는 음식은 null 로 남고 0으로 계산되지 않는다', () => {
  eq(scale(null, 300), null);
  eq(scale(undefined, 300), null);
  const n = mealNutrients(meal('2026-10-17', 300, 284, 12.83, null));
  eq(n.potassium, null, '칼륨');
  eq(n.kcal, 852, '칼로리는 그대로 계산');
  eq(potassiumLevel(n.potassium), 'unknown', '등급');
  eq(potassiumLevel(null), 'unknown');
  eq(potassiumLevel(undefined), 'unknown');
});
await test('칼륨 없음: 하루 합계에서 0으로 더하지 않고 "정보 없음" 개수로 센다', () => {
  const meals = [meal('2026-10-17', 100, 100, 1, 150), meal('2026-10-17', 100, 200, 2, null)];
  const t = dayTotals(meals, '2026-10-17');
  eq(t.potassiumKnown, 150); eq(t.potassiumMissing, 1); eq(t.kcal, 300);
});
await test('칼륨 등급 기본값: 100 미만 적음, 100~200 보통, 200 이상 많음 (0mg 은 적음)', () => {
  eq(potassiumLevel(0), 'low'); eq(potassiumLevel(99.9), 'low');
  eq(potassiumLevel(100), 'mid'); eq(potassiumLevel(199.9), 'mid');
  eq(potassiumLevel(200), 'high'); eq(potassiumLevel(850), 'high');
});
await test('칼륨 등급: 설정에서 바꾼 기준값을 따른다', () => {
  const s = { ...DEFAULT_SETTINGS, kLow: 150, kHigh: 300 };
  eq(potassiumLevel(120, s), 'low'); eq(potassiumLevel(250, s), 'mid'); eq(potassiumLevel(300, s), 'high');
});
await test('날짜 계산: 월이 바뀌어도 하루씩 정확히', () => {
  eq(addDays('2026-10-01', -1), '2026-09-30');
  eq(addDays('2026-12-31', 1), '2027-01-01');
  eq(addDays('2026-03-01', -1), '2026-02-28');
});
await test('7일 평균: 오늘은 빼고, 기록이 있는 날만 평균 낸다', () => {
  const today = '2026-10-17';
  const meals = [
    meal('2026-10-17', 100, 5000, 50, 0),  // 오늘: 평균에 넣지 않음
    meal('2026-10-16', 100, 1000, 30, 0),
    meal('2026-10-14', 100, 1200, 40, 0),
    meal('2026-10-14', 100, 200, 10, 0),   // 같은 날 두 번 → 1400
    meal('2026-10-10', 100, 900, 20, 0),   // 7일 전: 포함
    meal('2026-10-09', 100, 9999, 99, 0),  // 8일 전: 제외
  ];
  const a = recentAverage(meals, today, 7);
  eq(a.days, 3);
  eq(a.kcal, (1000 + 1400 + 900) / 3);
  eq(a.protein, (30 + 50 + 20) / 3);
});
await test('7일 평균: 지난 7일 기록이 없으면 null', () => {
  eq(recentAverage([meal('2026-10-17', 100, 100, 1, 1)], '2026-10-17'), null);
});
await test('비교: 어제·평균보다 많이 드시면 칭찬 표시', () => {
  const meals = [
    meal('2026-10-17', 100, 1300, 50, 0),
    meal('2026-10-16', 100, 1000, 40, 0),
    meal('2026-10-15', 100, 1200, 60, 0),
  ];
  const c = compareToday(meals, '2026-10-17');
  eq(c.moreThanYesterday, true); eq(c.moreThanAverage, true);  // 평균 1100
  eq(c.proteinMoreThanYesterday, true);
  eq(c.proteinMoreThanAverage, false, '단백질 평균 50g 과 같으면 "더 많음" 아님');
  eq(cheerMessage(c), '어제보다, 지난 일주일보다 더 드셨어요. 정말 잘하셨어요!');
});
await test('비교: 덜 드신 날·기록 없는 날도 탓하지 않는 문구', () => {
  const meals = [meal('2026-10-17', 100, 500, 10, 0), meal('2026-10-16', 100, 1000, 40, 0)];
  const c = compareToday(meals, '2026-10-17');
  eq(c.moreThanYesterday, false); eq(c.moreThanAverage, false);
  eq(cheerMessage(c), '오늘 드신 것 하나하나가 다 소중해요. 기록해 주셔서 고마워요.');
  const none = compareToday(meals, '2026-10-18');
  eq(none.today.count, 0); eq(none.moreThanYesterday, false);
  eq(cheerMessage(none).includes('천천히'), true);
});
await test('비교: 어제 기록이 없으면 어제와 비교하지 않는다', () => {
  const c = compareToday([meal('2026-10-17', 100, 100, 1, 0)], '2026-10-17');
  eq(c.yesterday, null); eq(c.moreThanYesterday, false);
});
await test('목표까지 남은 양', () => {
  eq(remainingToGoal(52.4, 55), 2.6);
  eq(remainingToGoal(55.5, 55), 0);
  eq(remainingToGoal(null, 55), null);
  eq(remainingToGoal(52.4, null), null, '목표를 입력하지 않았으면 계산하지 않음');
});
await test('목표 체중: 기본값 없음, 입력한 값만 쓴다', () => {
  eq(DEFAULT_SETTINGS.goalLow, null); eq(DEFAULT_SETTINGS.goalHigh, null);
  eq(goalText(DEFAULT_SETTINGS), null);
  eq(goalText({ goalLow: 55, goalHigh: 57 }), '55~57kg');
  eq(goalText({ goalLow: 55, goalHigh: 55 }), '55kg');
  eq(JSON.stringify(parseGoal('', '')), '{"goalLow":null,"goalHigh":null}');
  eq(JSON.stringify(parseGoal('55', '')), '{"goalLow":55,"goalHigh":55}');
  eq(JSON.stringify(parseGoal('55', '57')), '{"goalLow":55,"goalHigh":57}');
  let threw = 0;
  for (const [a, b] of [['57', '55'], ['-1', ''], ['abc', '']]) { try { parseGoal(a, b); } catch { threw++; } }
  eq(threw, 3);
});
await test('측정 시점: 쉼표로 나눠 입력, 빈 값·중복 제거', () => {
  eq(parseTimings(' 아침, 저녁 ,, 아침, 운동 후 ').join('|'), '아침|저녁|운동 후');
  let threw = 0;
  for (const t of ['', ' , ', 'a,b,c,d,e,f,g', '열한글자짜리측정시점이에']) { try { parseTimings(t); } catch { threw++; } }
  eq(threw, 4);
});
await test('최근 체중: 날짜·시간 순 마지막 값', () => {
  const w = latestWeight([
    { date: '2026-10-16', time: '09:00', kg: 52.5 },
    { date: '2026-10-17', kg: 52.9 },
    { date: '2026-10-17', time: '14:00', kg: 52.7 },
  ]);
  eq(w.kg, 52.7);
});
await test('백업 검사: 형식이 틀리면 거부', () => {
  const ok = { app: 'mom-meal', meals: [], weights: [{ date: '2026-10-17', kg: 52 }], favorites: [] };
  eq(validateBackup(ok), true);
  let threw = 0;
  for (const bad of [null, {}, { ...ok, app: 'x' }, { ...ok, meals: 'x' }, { ...ok, weights: [{ date: '2026-10-17', kg: '52' }] }]) {
    try { validateBackup(bad); } catch { threw++; }
  }
  eq(threw, 5);
});

// 실제로 앱에 넣은 식약처 데이터 확인
await test('앱 데이터: 식약처 원본 값이 그대로 들어 있다 (가래떡 D102-053000000-0001)', async () => {
  const meta = await loadFoods('../data/foods.json');
  eq(meta.count, 19738); eq(meta.baseDate, '2026-09-29'); eq(meta.provider, '식품의약품안전처');
  const f = getFood('D102-053000000-0001');
  eq(f.name, '가래떡'); eq(f.unit, 'g'); eq(f.kcal, 195); eq(f.protein, 3.92); eq(f.potassium, 23);
});
await test('앱 데이터: 칼륨 값이 없는 음식은 null (0이 아님) → "칼륨 정보 없음"', () => {
  const f = getFood('D202-120000000-4493');
  eq(f.potassium, null);
  const n = mealNutrients({ amount: 765, per100: { kcal: f.kcal, protein: f.protein, potassium: f.potassium } });
  eq(n.potassium, null); eq(potassiumLevel(n.potassium), 'unknown');
  eq(Math.round(n.kcal), Math.round(284 * 7.65));
});
await test('검색: 이름이 맞는 일반 음식이 먼저 나온다', () => {
  const hits = searchFoods('가래떡');
  eq(hits.length > 0, true);
  eq(hits[0].name, '가래떡'); eq(hits[0].rest, '');
  eq(searchFoods('   ').length, 0);
});

// 체중 그래프의 값 라벨이 잘리거나 겹치지 않는지 (실제로 그려서 글자 상자를 잰다)
const { renderWeightChart } = await import('../js/chart.js');
const css = document.createElement('link');
css.rel = 'stylesheet'; css.href = '../app.css';
document.head.append(css);
await new Promise((r) => { css.onload = r; css.onerror = r; });

const series = (kgs) => kgs.map((kg, i) => ({ date: addDays('2026-10-01', i * 2), kg }));
const LABEL_CASES = [
  ['기록 하나 (목표 없음)', [30.9], null, null, 350],
  ['기록 하나 (목표 있음)', [30.9], 38, 40, 350],
  ['기록 하나, 좁은 화면', [130.9], null, null, 280],
  ['마지막 값이 가장 높음 (위쪽 끝)', [50, 51, 52, 53.9], null, null, 350],
  ['마지막 값이 가장 낮음 (아래쪽 끝)', [53, 52, 51, 49.1], null, null, 350],
  ['오른쪽 끝, 긴 라벨', [128.2, 129.5, 130.9], null, null, 300],
  ['마지막 값이 목표 글자 바로 아래', [50, 52, 54, 56.9], 55, 57, 350],
  ['목표 구간 안', [55.5, 56.1], 55, 57, 350],
];
for (const [name, kgs, gl, gh, width] of LABEL_CASES) {
  await test(`그래프 라벨: ${name}`, () => {
    const box = document.createElement('div');
    box.style.width = `${width}px`;
    document.body.append(box);
    renderWeightChart(box, series(kgs), gl, gh);
    const svg = box.querySelector('svg');
    const [, , W, H] = svg.getAttribute('viewBox').split(' ').map(Number);
    const label = svg.querySelector('.last-label');
    const b = label.getBBox();
    eq(label.textContent, `${kgs.at(-1)}kg`);
    if (b.width === 0) throw new Error('라벨이 그려지지 않음');
    const plotLeft = Number(svg.querySelector('.grid').getAttribute('x1'));
    if (b.x < plotLeft) throw new Error(`왼쪽으로 넘침: ${b.x.toFixed(1)} < ${plotLeft}`);
    if (b.x + b.width > W) throw new Error(`오른쪽으로 잘림: ${(b.x + b.width).toFixed(1)} > ${W}`);
    if (b.y < 0) throw new Error(`위로 잘림: ${b.y.toFixed(1)}`);
    if (b.y + b.height > H) throw new Error('아래로 잘림');
    const hit = (o) => b.x < o.x + o.width && o.x < b.x + b.width && b.y < o.y + o.height && o.y < b.y + b.height;
    for (const t of svg.querySelectorAll('.tick, .goal-label')) {
      if (hit(t.getBBox())) throw new Error(`"${t.textContent}" 글자와 겹침`);
    }
    if (hit(svg.querySelectorAll('.dot')[kgs.length - 1].getBBox())) throw new Error('점을 가림');
    box.remove();
  });
}

const fails = results.filter((r) => r[0] === 'FAIL');
document.getElementById('out').textContent =
  results.map((r) => r.join(' | ')).join('\n') +
  `\nSUMMARY: ${results.length - fails.length} passed, ${fails.length} failed`;
document.title = fails.length ? 'FAIL' : 'PASS';
</script>
</body>
</html>
