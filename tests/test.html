<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>계산 테스트</title></head>
<body>
<pre id="out">실행 중…</pre>
<script type="module">
import {
  scale, servingsToAmount, mealNutrients, dayTotals, recentAverage, compareToday, potassiumLevel,
  addDays, remainingToGoal, cheerMessage, validateBackup, latestWeight, DEFAULT_SETTINGS,
  goalText, parseGoal, parseTimings,
  normalizeMeal, recipeNutrients, potassiumStatus, isRecordable, parseCountUnit, parseLabelFood, POTASSIUM_LABEL,
  validateSettingsBackup,
} from '../js/calc.js';
import { exportJson, importJson, exportSettingsJson, mergeSettings, readBackupFile } from '../js/store.js';
import { loadFoods, getFood, searchFoods } from '../js/foods.js';

const results = [];
function test(name, fn) {
  return Promise.resolve().then(fn).then(
    () => results.push(['PASS', name]),
    (e) => results.push(['FAIL', name, e.message]),
  );
}
function eq(actual, expected, msg = '') {
  const ok = typeof expected === 'number' && typeof actual === 'number'
    ? Math.abs(actual - expected) < 1e-9
    : actual === expected;
  if (!ok) throw new Error(`${msg} 기대 ${JSON.stringify(expected)}, 실제 ${JSON.stringify(actual)}`);
}

// 100g당 값으로 만든 식사 기록
const meal = (date, amount, kcal, protein, potassium) => ({ date, amount, per100: { kcal, protein, potassium } });

await test('그램 환산: 100g 기준 값을 먹은 양으로 비례 계산', () => {
  eq(scale(195, 100), 195);
  eq(scale(195, 250), 487.5);
  eq(scale(3.92, 50), 1.96);
  eq(scale(80, 0), 0);
});
await test('그램 환산: 한 그릇 = 250g 이면 1.5그릇 = 375g', () => {
  eq(servingsToAmount(1.5, 250), 375);
  eq(servingsToAmount(0.5, 250), 125);
  const n = mealNutrients(meal('2026-10-17', servingsToAmount(1.5, 250), 120, 4, 200));
  eq(n.kcal, 450); eq(n.protein, 15); eq(n.potassium, 750);
});
await test('하루 합계: 같은 날 기록만 더한다', () => {
  const meals = [
    meal('2026-10-17', 200, 150, 5, 100),   // 300kcal, 10g, 200mg
    meal('2026-10-17', 50, 400, 20, 300),   // 200kcal, 10g, 150mg
    meal('2026-10-16', 100, 999, 99, 999),  // 다른 날
  ];
  const t = dayTotals(meals, '2026-10-17');
  eq(t.count, 2); eq(t.kcal, 500); eq(t.protein, 20);
  eq(t.potassiumKnown, 350); eq(t.potassiumMissing, 0);
});
await test('하루 합계: 기록 없는 날은 0건 0kcal', () => {
  const t = dayTotals([meal('2026-10-17', 100, 100, 1, 1)], '2026-10-15');
  eq(t.count, 0); eq(t.kcal, 0);
});
await test('칼륨 없음: 값이 없는 음식은 null 로 남고 0으로 계산되지 않는다', () => {
  eq(scale(null, 300), null);
  eq(scale(undefined, 300), null);
  const n = mealNutrients(meal('2026-10-17', 300, 284, 12.83, null));
  eq(n.potassium, null, '칼륨');
  eq(n.kcal, 852, '칼로리는 그대로 계산');
  eq(potassiumLevel(n.potassium), 'unknown', '등급');
  eq(potassiumLevel(null), 'unknown');
  eq(potassiumLevel(undefined), 'unknown');
});
await test('칼륨 없음: 하루 합계에서 0으로 더하지 않고 "정보 없음" 개수로 센다', () => {
  const meals = [meal('2026-10-17', 100, 100, 1, 150), meal('2026-10-17', 100, 200, 2, null)];
  const t = dayTotals(meals, '2026-10-17');
  eq(t.potassiumKnown, 150); eq(t.potassiumMissing, 1); eq(t.kcal, 300);
});
await test('칼륨 등급 기본값: 100 미만 적음, 100~200 보통, 200 이상 많음 (0mg 은 적음)', () => {
  eq(potassiumLevel(0), 'low'); eq(potassiumLevel(99.9), 'low');
  eq(potassiumLevel(100), 'mid'); eq(potassiumLevel(199.9), 'mid');
  eq(potassiumLevel(200), 'high'); eq(potassiumLevel(850), 'high');
});
await test('칼륨 등급: 설정에서 바꾼 기준값을 따른다', () => {
  const s = { ...DEFAULT_SETTINGS, kLow: 150, kHigh: 300 };
  eq(potassiumLevel(120, s), 'low'); eq(potassiumLevel(250, s), 'mid'); eq(potassiumLevel(300, s), 'high');
});
await test('날짜 계산: 월이 바뀌어도 하루씩 정확히', () => {
  eq(addDays('2026-10-01', -1), '2026-09-30');
  eq(addDays('2026-12-31', 1), '2027-01-01');
  eq(addDays('2026-03-01', -1), '2026-02-28');
});
await test('7일 평균: 오늘은 빼고, 기록이 있는 날만 평균 낸다', () => {
  const today = '2026-10-17';
  const meals = [
    meal('2026-10-17', 100, 5000, 50, 0),  // 오늘: 평균에 넣지 않음
    meal('2026-10-16', 100, 1000, 30, 0),
    meal('2026-10-14', 100, 1200, 40, 0),
    meal('2026-10-14', 100, 200, 10, 0),   // 같은 날 두 번 → 1400
    meal('2026-10-10', 100, 900, 20, 0),   // 7일 전: 포함
    meal('2026-10-09', 100, 9999, 99, 0),  // 8일 전: 제외
  ];
  const a = recentAverage(meals, today, 7);
  eq(a.days, 3);
  eq(a.kcal, (1000 + 1400 + 900) / 3);
  eq(a.protein, (30 + 50 + 20) / 3);
});
await test('7일 평균: 지난 7일 기록이 없으면 null', () => {
  eq(recentAverage([meal('2026-10-17', 100, 100, 1, 1)], '2026-10-17'), null);
});
await test('비교: 어제·평균보다 많이 드시면 칭찬 표시', () => {
  const meals = [
    meal('2026-10-17', 100, 1300, 50, 0),
    meal('2026-10-16', 100, 1000, 40, 0),
    meal('2026-10-15', 100, 1200, 60, 0),
  ];
  const c = compareToday(meals, '2026-10-17');
  eq(c.moreThanYesterday, true); eq(c.moreThanAverage, true);  // 평균 1100
  eq(c.proteinMoreThanYesterday, true);
  eq(c.proteinMoreThanAverage, false, '단백질 평균 50g 과 같으면 "더 많음" 아님');
  eq(cheerMessage(c), '어제보다, 지난 일주일보다 더 드셨어요. 정말 잘하셨어요!');
});
await test('비교: 덜 드신 날·기록 없는 날도 탓하지 않는 문구', () => {
  const meals = [meal('2026-10-17', 100, 500, 10, 0), meal('2026-10-16', 100, 1000, 40, 0)];
  const c = compareToday(meals, '2026-10-17');
  eq(c.moreThanYesterday, false); eq(c.moreThanAverage, false);
  eq(cheerMessage(c), '오늘 드신 것 하나하나가 다 소중해요. 기록해 주셔서 고마워요.');
  const none = compareToday(meals, '2026-10-18');
  eq(none.today.count, 0); eq(none.moreThanYesterday, false);
  eq(cheerMessage(none).includes('천천히'), true);
});
await test('비교: 어제 기록이 없으면 어제와 비교하지 않는다', () => {
  const c = compareToday([meal('2026-10-17', 100, 100, 1, 0)], '2026-10-17');
  eq(c.yesterday, null); eq(c.moreThanYesterday, false);
});
await test('목표까지 남은 양', () => {
  eq(remainingToGoal(52.4, 55), 2.6);
  eq(remainingToGoal(55.5, 55), 0);
  eq(remainingToGoal(null, 55), null);
  eq(remainingToGoal(52.4, null), null, '목표를 입력하지 않았으면 계산하지 않음');
});
await test('목표 체중: 기본값 없음, 입력한 값만 쓴다', () => {
  eq(DEFAULT_SETTINGS.goalLow, null); eq(DEFAULT_SETTINGS.goalHigh, null);
  eq(goalText(DEFAULT_SETTINGS), null);
  eq(goalText({ goalLow: 55, goalHigh: 57 }), '55~57kg');
  eq(goalText({ goalLow: 55, goalHigh: 55 }), '55kg');
  eq(JSON.stringify(parseGoal('', '')), '{"goalLow":null,"goalHigh":null}');
  eq(JSON.stringify(parseGoal('55', '')), '{"goalLow":55,"goalHigh":55}');
  eq(JSON.stringify(parseGoal('55', '57')), '{"goalLow":55,"goalHigh":57}');
  let threw = 0;
  for (const [a, b] of [['57', '55'], ['-1', ''], ['abc', '']]) { try { parseGoal(a, b); } catch { threw++; } }
  eq(threw, 3);
});
await test('측정 시점: 쉼표로 나눠 입력, 빈 값·중복 제거', () => {
  eq(parseTimings(' 아침, 저녁 ,, 아침, 운동 후 ').join('|'), '아침|저녁|운동 후');
  let threw = 0;
  for (const t of ['', ' , ', 'a,b,c,d,e,f,g', '열한글자짜리측정시점이에']) { try { parseTimings(t); } catch { threw++; } }
  eq(threw, 4);
});
await test('최근 체중: 날짜·시간 순 마지막 값', () => {
  const w = latestWeight([
    { date: '2026-10-16', time: '09:00', kg: 52.5 },
    { date: '2026-10-17', kg: 52.9 },
    { date: '2026-10-17', time: '14:00', kg: 52.7 },
  ]);
  eq(w.kg, 52.7);
});
await test('백업 검사: 형식이 틀리면 거부', () => {
  const ok = { app: 'mom-meal', meals: [], weights: [{ date: '2026-10-17', kg: 52 }], favorites: [] };
  eq(validateBackup(ok), true);
  let threw = 0;
  for (const bad of [null, {}, { ...ok, app: 'x' }, { ...ok, meals: 'x' }, { ...ok, weights: [{ date: '2026-10-17', kg: '52' }] }]) {
    try { validateBackup(bad); } catch { threw++; }
  }
  eq(threw, 5);
});

// 실제로 앱에 넣은 식약처 데이터 확인
await test('앱 데이터: 식약처 원본 값이 그대로 들어 있다 (가래떡 D102-053000000-0001)', async () => {
  const meta = await loadFoods('../data/foods.json');
  eq(meta.count, 19738); eq(meta.baseDate, '2026-09-29'); eq(meta.provider, '식품의약품안전처');
  const f = getFood('D102-053000000-0001');
  eq(f.name, '가래떡'); eq(f.unit, 'g'); eq(f.kcal, 195); eq(f.protein, 3.92); eq(f.potassium, 23);
});
await test('앱 데이터: 칼륨 값이 없는 음식은 null (0이 아님) → "칼륨 정보 없음"', () => {
  const f = getFood('D202-120000000-4493');
  eq(f.potassium, null);
  const n = mealNutrients({ amount: 765, per100: { kcal: f.kcal, protein: f.protein, potassium: f.potassium } });
  eq(n.potassium, null); eq(potassiumLevel(n.potassium), 'unknown');
  eq(Math.round(n.kcal), Math.round(284 * 7.65));
});
await test('검색: 이름이 맞는 일반 음식이 먼저 나온다', () => {
  const hits = searchFoods('가래떡');
  eq(hits.length > 0, true);
  eq(hits[0].name, '가래떡'); eq(hits[0].rest, '');
  eq(searchFoods('   ').length, 0);
});

// ───── 개수 단위 · 직접 만든 음식 · 직접 입력 음식 ─────
// 아래 '라벨' 수치는 계산 확인용 가상 값이다 (앱에 들어가는 값이 아님).
const EGG = 'D327-758010000-0001';   // 달걀_삶은것 100g당 150kcal, 단백질 12.8g, 칼륨 125mg
const RICE = 'D301-022000000-0001';  // 쌀밥 100g당 166kcal, 단백질 3.36g, 칼륨 26mg
const item = (code, amount, extra = {}) => {
  const f = getFood(code);
  return { code, name: f.name, unit: f.unit, basis: f.basis, amount,
    per: { kcal: f.kcal, protein: f.protein, potassium: f.potassium }, ...extra };
};
const labelItem = (amount, basis, kcal, protein, potassium) =>
  ({ name: '라벨 음식', unit: 'g', basis, amount, per: { kcal, protein, potassium } });

await test('기준량 환산: 100g이 아닌 기준(1인분, 라벨 200ml)도 비례 계산', () => {
  eq(scale(450, 2, 1), 900);        // 1인분 450kcal × 2인분
  eq(scale(400, 100, 200), 200);    // 200ml당 400kcal 중 100ml
  eq(scale(null, 100, 200), null);
});
await test('예전 기록(per100)은 새 형식(per+basis)으로 바뀌고 값은 같다', () => {
  const old = { date: '2026-10-17', amount: 150, per100: { kcal: 195, protein: 3.92, potassium: 23 } };
  const n = normalizeMeal(old);
  eq(n.basis, 100); eq(n.per.kcal, 195); eq('per100' in n, false);
  eq(mealNutrients(n).kcal, mealNutrients(old).kcal);
  eq(normalizeMeal(n).basis, 100, '두 번 바꿔도 그대로');
});
await test('개수 단위: "1개 = 50g" 설정과 입력 검사', () => {
  eq(JSON.stringify(parseCountUnit('개', '50')), '{"name":"개","amount":50}');
  eq(parseCountUnit('', ''), null, '둘 다 비우면 단위 없음');
  let threw = 0;
  for (const [n, a] of [['개', ''], ['', '50'], ['개', '0'], ['아주긴단위이름', '5']]) { try { parseCountUnit(n, a); } catch { threw++; } }
  eq(threw, 4);
});
await test('개수 단위: 삶은 달걀 2개(1개=50g) = 100g → 150kcal, 단백질 12.8g, 칼륨 125mg', () => {
  const egg = getFood(EGG);
  eq(egg.name, '달걀_삶은것');
  const n = mealNutrients({ amount: 2 * 50, basis: egg.basis, per: { kcal: egg.kcal, protein: egg.protein, potassium: egg.potassium } });
  eq(n.kcal, 150); eq(n.protein, 12.8); eq(n.potassium, 125);
});
await test('직접 만든 음식: 재료 수치를 더한다 (쌀밥 210g + 달걀 1개 50g)', () => {
  const t = recipeNutrients([item(RICE, 210), item(EGG, 50)]);
  eq(Math.abs(t.kcal - (166 * 2.1 + 75)) < 1e-9, true, 'kcal');
  eq(Math.abs(t.protein - (3.36 * 2.1 + 6.4)) < 1e-9, true, '단백질');
  eq(Math.abs(t.potassium - (26 * 2.1 + 62.5)) < 1e-9, true, '칼륨');
  eq(t.potassiumPartial, false);
});
await test('직접 만든 음식: 칼륨 없는 재료가 있으면 "칼륨 일부 정보 없음" (0으로 더하지 않음)', () => {
  const t = recipeNutrients([item(RICE, 210), item(EGG, 50), labelItem(5, 10, 90, 0, null)]);
  eq(t.potassiumPartial, true); eq(t.missingCount, 1);
  eq(Math.abs(t.potassium - (26 * 2.1 + 62.5)) < 1e-9, true, '아는 재료만 더함');
  eq(Math.abs(t.kcal - (166 * 2.1 + 75 + 45)) < 1e-9, true, '칼로리는 모두 더함');
  eq(potassiumStatus(t.potassium, t.potassiumPartial), 'partial');
  eq(POTASSIUM_LABEL.partial, '칼륨 일부 정보 없음');
});
await test('직접 만든 음식: 모든 재료에 칼륨이 없으면 "칼륨 정보 없음"', () => {
  const t = recipeNutrients([labelItem(5, 10, 90, 0, null), item('D202-120000000-4493', 100)]);
  eq(t.potassium, null); eq(t.potassiumPartial, false);
  eq(potassiumStatus(t.potassium, t.potassiumPartial), 'unknown');
});
await test('직접 만든 음식: 아는 재료만으로 기준 이상이면 "많음 (일부 정보 없음)"', () => {
  eq(potassiumStatus(250, true), 'partial-high');
  eq(potassiumStatus(150, true), 'partial');
  eq(potassiumStatus(150, false), 'mid');
});
await test('직접 만든 음식: 1인분·2인분 기록과 하루 합계(칼륨 일부 없음은 따로 셈)', () => {
  const t = recipeNutrients([item(RICE, 210), labelItem(5, 10, 90, 0, null)]);
  const per = { kcal: t.kcal, protein: t.protein, potassium: t.potassium, potassiumPartial: t.potassiumPartial };
  const m = { date: '2026-10-17', amount: 2, basis: 1, per };
  const n = mealNutrients(m);
  eq(n.kcal, t.kcal * 2); eq(n.potassiumPartial, true);
  const d = dayTotals([m, meal('2026-10-17', 100, 100, 1, 40)], '2026-10-17');
  eq(Math.abs(d.potassiumKnown - (t.potassium * 2 + 40)) < 1e-9, true);
  eq(d.potassiumMissing, 1);
});
await test('직접 만든 음식: 칼로리 없는 재료는 넣을 수 없다', () => {
  let threw = false;
  try { recipeNutrients([labelItem(5, 10, null, null, null)]); } catch { threw = true; }
  eq(threw, true);
});
await test('직접 입력 음식: 수치를 비워 둔 채 저장 가능, 비운 칸은 null (0 아님), 기록은 불가', () => {
  const f = parseLabelFood({ name: '영양음료', basis: '', unit: null, kcal: '', protein: ' ', potassium: '' });
  eq(f.name, '영양음료'); eq(f.basis, null); eq(f.kcal, null); eq(f.protein, null); eq(f.potassium, null);
  eq(isRecordable(f), false);
});
await test('직접 입력 음식: 라벨 200ml당 값 → 100ml 기록은 절반, 칼륨 비우면 "정보 없음"', () => {
  const f = parseLabelFood({ name: '영양음료', basis: '200', unit: 'ml', kcal: '400', protein: '14', potassium: '' });
  eq(isRecordable(f), true); eq(f.potassium, null);
  const n = mealNutrients({ amount: 100, basis: f.basis, per: { kcal: f.kcal, protein: f.protein, potassium: f.potassium } });
  eq(n.kcal, 200); eq(n.protein, 7); eq(n.potassium, null);
  eq(potassiumStatus(n.potassium, false), 'unknown');
});
await test('직접 입력 음식: 잘못된 값은 거부', () => {
  let threw = 0;
  for (const bad of [{ name: '' }, { name: 'a', basis: '200' }, { name: 'a', basis: '0', unit: 'g' },
    { name: 'a', kcal: '-5' }, { name: 'a', protein: 'abc' }]) {
    try { parseLabelFood(bad); } catch { threw++; }
  }
  eq(threw, 5);
});
await test('백업: 직접 만든 음식·직접 입력 음식·개수 단위가 내보내기/불러오기에 포함', () => {
  const recipe = { code: 'my-r1', kind: 'recipe', name: '만든 음식', items: [item(RICE, 210)], kcal: 348.6, protein: 7.056, potassium: 54.6, potassiumPartial: false };
  const label = { code: 'my-l1', kind: 'label', name: '라벨 음식', basis: null, unit: null, kcal: null, protein: null, potassium: null };
  const state = { app: 'mom-meal', version: 1, meals: [], weights: [], favorites: ['my-r1'], servings: {},
    units: { [EGG]: { name: '개', amount: 50 }, 'my-l1': { name: '팩', amount: 200 } },
    customFoods: [recipe, label], settings: {} };
  const back = importJson(exportJson(state));
  eq(back.customFoods.length, 2);
  eq(JSON.stringify(back.customFoods[0]), JSON.stringify(recipe));
  eq(back.customFoods[1].kcal, null, '비워 둔 값은 null 그대로');
  eq(back.units[EGG].amount, 50); eq(back.units['my-l1'].name, '팩');
  eq(back.favorites[0], 'my-r1');
});
await test('백업: 예전 백업(per100, 직접 등록 음식 없음)도 불러와진다', () => {
  const old = { app: 'mom-meal', meals: [{ date: '2026-10-17', amount: 100, per100: { kcal: 195, protein: 3.92, potassium: 23 } }], weights: [], favorites: [] };
  const back = importJson(JSON.stringify(old));
  eq(back.meals[0].per.kcal, 195); eq(back.meals[0].basis, 100);
  eq(back.customFoods.length, 0); eq(JSON.stringify(back.units), '{}');
});
await test('백업 검사: 직접 등록 음식 형식이 틀리면 거부', () => {
  const base = { app: 'mom-meal', meals: [], weights: [], favorites: [] };
  let threw = 0;
  for (const bad of [{ customFoods: 'x' }, { customFoods: [{ code: 'x1', kind: 'label', name: 'a' }] },
    { customFoods: [{ code: 'my-1', kind: 'other', name: 'a' }] }, { customFoods: [{ code: 'my-1', kind: 'recipe', name: 'a' }] },
    { units: [] }]) {
    try { validateBackup({ ...base, ...bad }); } catch { threw++; }
  }
  eq(threw, 5);
});

// ───── 설정만 내보내기 / 합치기 ─────
// 두 폰의 상태를 흉내 낸다. 수치는 계산 확인용 가상 값.
function phoneA() {   // 설정을 내보내는 폰
  return {
    app: 'mom-meal', version: 1,
    meals: [{ id: 'a1', date: '2026-10-17', amount: 100, basis: 100, per: { kcal: 100, protein: 1, potassium: 1 } }],
    weights: [{ id: 'aw', date: '2026-10-17', kg: 52, timing: '아침' }],
    favorites: [RICE, 'my-a-label', 'my-a-recipe', 'my-a-new'],
    servings: { [RICE]: 210 },
    units: { [EGG]: { name: '개', amount: 50 }, 'my-a-label': { name: '팩', amount: 200 } },
    customFoods: [
      { code: 'my-a-label', kind: 'label', name: '영양음료', basis: 200, unit: 'ml', kcal: 400, protein: 14, potassium: null },
      { code: 'my-a-recipe', kind: 'recipe', name: '계란밥', items: [item(RICE, 210), { ...labelItem(100, 200, 400, 14, null), code: 'my-a-label' }],
        kcal: 1, protein: 1, potassium: 1, potassiumPartial: true },
      { code: 'my-a-new', kind: 'recipe', name: '새 음식', items: [{ ...labelItem(200, 200, 400, 14, null), code: 'my-a-label' }],
        kcal: 400, protein: 14, potassium: null, potassiumPartial: false },
    ],
    settings: { goalLow: 55, goalHigh: 57, kLow: 120, kHigh: 250, timings: ['아침', '저녁'] },
  };
}
function phoneB() {   // 설정을 불러오는 폰: 자기 기록이 있고, 같은 이름의 라벨 음식을 이미 따로 만들어 둠
  return {
    app: 'mom-meal', version: 1,
    meals: [{ id: 'b1', date: '2026-10-18', amount: 50, basis: 100, per: { kcal: 200, protein: 2, potassium: null } }],
    weights: [{ id: 'bw', date: '2026-10-18', kg: 53, timing: '저녁' }],
    favorites: ['my-b-label'],
    servings: { [EGG]: 60 },
    units: {},
    customFoods: [
      { code: 'my-b-label', kind: 'label', name: ' 영양음료 ', basis: 200, unit: 'ml', kcal: 400, protein: 14, potassium: null },
      { code: 'my-a-recipe', kind: 'recipe', name: '계란밥(이름 바꿈)', items: [item(RICE, 200)], kcal: 2, protein: 2, potassium: 2, potassiumPartial: false },
    ],
    settings: { ...DEFAULT_SETTINGS },
  };
}

await test('설정만 내보내기: 식사·체중 기록은 빠지고 설정 항목은 모두 들어간다', () => {
  const out = JSON.parse(exportSettingsJson(phoneA()));
  eq(out.kind, 'settings');
  eq('meals' in out, false); eq('weights' in out, false);
  eq(out.favorites.length, 4); eq(out.customFoods.length, 3);
  eq(out.units[EGG].amount, 50); eq(out.servings[RICE], 210);
  eq(JSON.stringify(out.settings), JSON.stringify({ goalLow: 55, goalHigh: 57, kLow: 120, kHigh: 250, timings: ['아침', '저녁'] }));
  eq(validateSettingsBackup(out), true);
});
await test('설정 합치기: 기존 식사·체중 기록은 그대로', () => {
  const b = phoneB();
  const { state } = mergeSettings(b, JSON.parse(exportSettingsJson(phoneA())));
  eq(JSON.stringify(state.meals), JSON.stringify(b.meals));
  eq(JSON.stringify(state.weights), JSON.stringify(b.weights));
});
await test('설정 합치기: 같은 음식(같은 코드, 또는 같은 종류·이름)은 다시 추가하지 않는다', () => {
  const { state, report } = mergeSettings(phoneB(), JSON.parse(exportSettingsJson(phoneA())));
  eq(state.customFoods.length, 3, '기존 2개 + 새 음식 1개');
  eq(report.added.join('|'), '새 음식');
  eq(report.skipped.length, 2);
  eq(state.customFoods.filter((c) => c.code === 'my-a-recipe').length, 1, '같은 코드는 하나만');
  eq(state.customFoods.find((c) => c.code === 'my-a-recipe').name, '계란밥(이름 바꿈)', '기존 음식을 그대로 둔다');
  eq(state.customFoods.filter((c) => c.kind === 'label').length, 1, '이름이 같은 라벨 음식은 하나만');
});
await test('설정 합치기: 건너뛴 음식을 가리키던 즐겨찾기·단위·재료는 기존 음식으로 연결', () => {
  const { state } = mergeSettings(phoneB(), JSON.parse(exportSettingsJson(phoneA())));
  eq(state.favorites.join('|'), ['my-b-label', RICE, 'my-a-recipe', 'my-a-new'].join('|'), '중복 없이 뒤에 덧붙임');
  eq(state.units['my-b-label'].name, '팩'); eq('my-a-label' in state.units, false);
  const added = state.customFoods.find((c) => c.code === 'my-a-new');
  eq(added.items[0].code, 'my-b-label', '재료 코드도 기존 음식으로');
  eq(state.customFoods.some((c) => c.code === 'my-a-label'), false);
});
await test('설정 합치기: 단위·한 그릇 무게는 합치고, 목표·칼륨 기준·측정 시점은 파일 값으로', () => {
  const { state } = mergeSettings(phoneB(), JSON.parse(exportSettingsJson(phoneA())));
  eq(state.units[EGG].amount, 50);
  eq(state.servings[EGG], 60, '이 폰에만 있던 값은 유지'); eq(state.servings[RICE], 210);
  eq(state.settings.goalLow, 55); eq(state.settings.kHigh, 250); eq(state.settings.timings.join('|'), '아침|저녁');
});
await test('설정 합치기: 같은 설정 파일을 두 번 불러와도 늘어나지 않는다', () => {
  const file = JSON.parse(exportSettingsJson(phoneA()));
  const once = mergeSettings(phoneB(), file).state;
  const twice = mergeSettings(once, file);
  eq(JSON.stringify(twice.state), JSON.stringify(once));
  eq(twice.report.added.length, 0); eq(twice.report.favoritesAdded, 0);
});
await test('백업 파일 읽기: 설정 파일은 합치고, 전체 백업은 바꾼다', () => {
  const b = phoneB();
  const s = readBackupFile(exportSettingsJson(phoneA()), b);
  eq(s.kind, 'settings'); eq(s.state.meals.length, 1); eq(s.state.meals[0].id, 'b1');
  const f = readBackupFile(exportJson(phoneA()), b);
  eq(f.kind, 'full'); eq(f.state.meals[0].id, 'a1');
});
await test('설정 파일 검사: 형식이 틀리면 거부', () => {
  const good = JSON.parse(exportSettingsJson(phoneA()));
  const bads = [
    { ...good, app: 'x' },
    { ...good, meals: [] },
    { ...good, favorites: 'x' },
    { ...good, customFoods: [{ code: 'x', kind: 'label', name: 'a' }] },
    { ...good, units: { a: { name: '개', amount: 0 } } },
    { ...good, servings: { a: -1 } },
    { ...good, settings: { ...good.settings, kHigh: 50 } },
    { ...good, settings: { ...good.settings, goalLow: 60 } },
    { ...good, settings: { ...good.settings, timings: [] } },
  ];
  let threw = 0;
  for (const bad of bads) { try { validateSettingsBackup(bad); } catch { threw++; } }
  eq(threw, bads.length);
});

// ───── 화면 꾸미기: 음식 이모지, 목표 진행 막대 ─────
const { foodEmoji, goalProgress } = await import('../js/look.js');
await test('음식 이모지: 이름으로 먼저, 없으면 분류로', () => {
  const cases = [
    ['달걀_삶은것', '빵 및 과자류', '🥚'], ['달걀찜', '찜류', '🥚'], ['쌀밥', '밥류', '🍚'], ['가래떡', '빵 및 과자류', '🍡'],
    ['흰죽', '죽 및 스프류', '🥣'], ['쌀국수', '면 및 만두류', '🍜'], ['김밥_계란', '밥류', '🥚'], ['참치김밥', '밥류', '🍙'],
    ['바나나우유', '음료 및 차류', '🥛'], ['두유', '음료 및 차류', '🥛'], ['차돌된장찌개', '찌개 및 전골류', '🍲'],
    ['미역국', '국 및 탕류', '🍲'], ['시금치나물', '나물·숙채류', '🥬'], ['알 수 없는 요리', '구이류', '🍖'], ['무언가', '', '🍽️'],
  ];
  const wrong = cases.filter(([name, category, e]) => foodEmoji({ name, category }) !== e)
    .map(([name, category, e]) => `${name}: ${foodEmoji({ name, category })} (기대 ${e})`);
  if (wrong.length) throw new Error(wrong.join(', '));
  eq(foodEmoji({ name: '만든 음식', custom: 'recipe' }), '🍳');
  eq(foodEmoji({ name: '영양음료', custom: 'label', unit: 'ml' }), '🥛', '이름에 음료가 있으면 이름 우선');
  eq(foodEmoji({ name: '제품', custom: 'label', unit: 'ml' }), '🧃');
  eq(foodEmoji(null), '🍽️');
});
await test('목표 진행: 같은 측정 시점의 첫 기록부터 목표 하한까지 온 정도', () => {
  const ws = [
    { date: '2026-10-01', time: '08:00', kg: 52, timing: '아침' },
    { date: '2026-10-02', time: '20:00', kg: 50, timing: '저녁' },   // 다른 시점은 시작점에 쓰지 않음
    { date: '2026-10-10', time: '08:00', kg: 53, timing: '아침' },
  ];
  const p = goalProgress(ws, 55);
  eq(p.startKg, 52); eq(p.currentKg, 53); eq(p.gained, 1); eq(p.percent, 33);
  eq(goalProgress(ws, null), null, '목표가 없으면 막대 없음');
  eq(goalProgress([], 55), null);
  eq(goalProgress([ws[0]], 55).percent, 0, '기록 하나면 0%');
  eq(goalProgress([...ws, { date: '2026-10-12', time: '08:00', kg: 55.2, timing: '아침' }], 55).percent, 100);
  eq(goalProgress([...ws, { date: '2026-10-12', time: '08:00', kg: 51, timing: '아침' }], 55).percent, 0, '줄면 0%에서 멈춤');
});

// 체중 그래프의 값 라벨이 잘리거나 겹치지 않는지 (실제로 그려서 글자 상자를 잰다)
const { renderWeightChart } = await import('../js/chart.js');
const css = document.createElement('link');
css.rel = 'stylesheet'; css.href = '../app.css';
document.head.append(css);
await new Promise((r) => { css.onload = r; css.onerror = r; });

const series = (kgs) => kgs.map((kg, i) => ({ date: addDays('2026-10-01', i * 2), kg }));
const LABEL_CASES = [
  ['기록 하나 (목표 없음)', [30.9], null, null, 350],
  ['기록 하나 (목표 있음)', [30.9], 38, 40, 350],
  ['기록 하나, 좁은 화면', [130.9], null, null, 280],
  ['마지막 값이 가장 높음 (위쪽 끝)', [50, 51, 52, 53.9], null, null, 350],
  ['마지막 값이 가장 낮음 (아래쪽 끝)', [53, 52, 51, 49.1], null, null, 350],
  ['오른쪽 끝, 긴 라벨', [128.2, 129.5, 130.9], null, null, 300],
  ['마지막 값이 목표 글자 바로 아래', [50, 52, 54, 56.9], 55, 57, 350],
  ['목표 구간 안', [55.5, 56.1], 55, 57, 350],
];
for (const [name, kgs, gl, gh, width] of LABEL_CASES) {
  await test(`그래프 라벨: ${name}`, () => {
    const box = document.createElement('div');
    box.style.width = `${width}px`;
    document.body.append(box);
    renderWeightChart(box, series(kgs), gl, gh);
    const svg = box.querySelector('svg');
    const [, , W, H] = svg.getAttribute('viewBox').split(' ').map(Number);
    const label = svg.querySelector('.last-label');
    const b = label.getBBox();
    eq(label.textContent, `${kgs.at(-1)}kg`);
    if (b.width === 0) throw new Error('라벨이 그려지지 않음');
    const plotLeft = Number(svg.querySelector('.grid').getAttribute('x1'));
    if (b.x < plotLeft) throw new Error(`왼쪽으로 넘침: ${b.x.toFixed(1)} < ${plotLeft}`);
    if (b.x + b.width > W) throw new Error(`오른쪽으로 잘림: ${(b.x + b.width).toFixed(1)} > ${W}`);
    if (b.y < 0) throw new Error(`위로 잘림: ${b.y.toFixed(1)}`);
    if (b.y + b.height > H) throw new Error('아래로 잘림');
    const hit = (o) => b.x < o.x + o.width && o.x < b.x + b.width && b.y < o.y + o.height && o.y < b.y + b.height;
    for (const t of svg.querySelectorAll('.tick, .goal-label')) {
      if (hit(t.getBBox())) throw new Error(`"${t.textContent}" 글자와 겹침`);
    }
    if (hit(svg.querySelectorAll('.dot')[kgs.length - 1].getBBox())) throw new Error('점을 가림');
    box.remove();
  });
}

const fails = results.filter((r) => r[0] === 'FAIL');
document.getElementById('out').textContent =
  results.map((r) => r.join(' | ')).join('\n') +
  `\nSUMMARY: ${results.length - fails.length} passed, ${fails.length} failed`;
document.title = fails.length ? 'FAIL' : 'PASS';
</script>
